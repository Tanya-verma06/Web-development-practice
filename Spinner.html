<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spinner</title>
    <style>

        .container{
            height: 40px;
            display:flex;
            justify-content: center;
            
        }

        .loader{
            height: 100px;
            width: 100px;
            border: 5px solid rgb(246, 249, 249);
            border-radius: 50%;
            border-top-color: brown;
            animation: spinner 2s infinite;

        }

        @keyframes spinner{

            from{

            }
            to{
                transform: rotate(360deg);
            }

        }
    </style>
</head>
<body>

    <div class="container">

        <div class="loader"></div>
    </div>

    
    
</body>
</html>
