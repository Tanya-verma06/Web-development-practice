<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text-Transformation</title>
    <style>
         #head{
            text-transform:uppercase;
        }
        .article{
            line-height: 50px;;

        }
    </style>
</head>
<body>
    <h1 id="head">This is my Text</h1>
    <p class="article"> Lorem ipsum dolor, sit amet consectetur adipisicing elit. Dignissimos placeat numquam libero explicabo accusantium dolores aliquam reiciendis voluptates corporis ipsum.</p>
    
</body>
</html>
