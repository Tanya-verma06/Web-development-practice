<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relative unit</title>
    <style>
        #first{
            height:50px;
            width:200px;
            font-size: 10px;
            background-color: red;

        }
        #second{
            height:60%;
            width:50%;
            font-size: 2.5em;

            background-color: aqua;
        }
    </style>
</head>
<body>
    <div id="first">
        First div

        <div id="second">
            Second div

        </div>
    </div>
    
    
</body>
</html>
