<!DOCTYPE html>
<html lang="en">

<head>

    <title>FORM</title>

    <style>
        form {
            width: 300px;
            background-color: rgb(244, 139, 209);
            border: 1px solid rgb(79, 6, 18);
            margin: 10px auto;
            padding: 20px;
        }

        .media {
            text-align: center;
            margin-top: 20px;
        }
    </style>

</head>

<body>

    <form action="/register" method="POST">

        <label for="name">Name:</label>
        <input type="text" id="name" name="name">

        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email">

        <br><br>

        Gender:

        <br>

        <input type="radio" value="male" id="male" name="gender">
        <label for="male">Male</label>

        <input type="radio" value="female" id="female" name="gender">
        <label for="female">Female</label>

        <br><br>

        <label for="date">Date:</label>
        <input type="date" id="date" name="date">

        <br><br>

        <label for="file">Upload file:</label>
        <input type="file" id="file" name="file">

        <br><br>

        <label for="branch">Branch:</label>

        <select name="branch" id="branch">
            <option value="CSE">CSE</option>
            <option value="Mechanical">Mechanical</option>
            <option value="Electrical">Electrical</option>
            <option value="Electronics">Electronics</option>
        </select>

        <br><br>

        Select skills:

        <br>

        <input type="checkbox" id="java" name="skills" value="Java">
        <label for="java">Java</label>

        <input type="checkbox" id="cpp" name="skills" value="C++">
        <label for="cpp">C++</label>

        <br><br>

        <button type="submit">Submit</button>

    </form>

    <div class="media">

        <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3536.5887019612906!2d77.61179877526061!3d27.575272476258544!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x39736d98dfe4cfd5%3A0x70de372d6558c765!2sKrishna%20Valley%20Wellness%20Resort%20Vrindavan!5e0!3m2!1sen!2sin!4v1787220059215!5m2!1sen!2sin"
            width="560"
            height="450"
            style="border:0;"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin">
        </iframe>

    </div>

    <div class="media">

        <iframe
            width="560"
            height="315"
            src="https://www.youtube.com/embed/OpWjt_wbV4E?si=mSUqAJdmgg20Ee5g"
            title="YouTube video player"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
        </iframe>

    </div>

</body>

</html>
