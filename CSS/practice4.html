<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>practice-4</title>
    <style>
        .box{
            height: 200px;
            width:200px;
            margin:10px;
            padding: 5px;
            border:2px dotted red;
            background-color: blue;
        }
        #first-button{
            height: 70px;
            width:70px;
            padding:10px 15px 10px 15px;
            margin:100px;
            border:2px dotted red;
            border-radius: 45px;
        }
    </style>
</head>
<body>
    <div class="box" style="box-sizing: content-box;">BOX-1</div>
    <div class="box" style="box-sizing:border-box;">BOX-2</div>
    <button id="first-button">Click me</button>
    
</body>
</html>
